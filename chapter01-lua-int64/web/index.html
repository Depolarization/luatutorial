<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lua 用两个 32 位整数模拟 64 位整数</title>
<style>
  :root{
    --bg1:#080c16; --bg2:#111a2e; --panel:#0e1524; --line:#233049;
    --txt:#e8eef7; --dim:#8b98b0; --blue:#58a6ff; --amber:#ffc857;
    --green:#7ee787; --purple:#c297ff; --red:#ff7b72; --cyan:#39d0d8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{
    background:
      radial-gradient(1100px 700px at 12% -10%, rgba(126,231,135,.10) 0%, transparent 60%),
      radial-gradient(1100px 800px at 85% 110%, rgba(88,166,255,.15) 0%, transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  }
  .stage{width:1920px;height:1080px;display:flex;flex-direction:column;padding:38px 56px 26px}
  /* ---------- header ---------- */
  .hdr{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:22px}
  .brand{font-size:22px;color:var(--dim);letter-spacing:.5px}
  .brand b{color:var(--blue);font-weight:600}
  .chapter{font-size:24px;color:var(--amber);font-weight:600;letter-spacing:1px}
  /* ---------- body ---------- */
  .grid{flex:1;display:flex;gap:38px;min-height:0}
  .left{flex:0 0 1280px;min-width:0}
  .right{flex:1;display:flex;flex-direction:column;gap:20px;min-width:0}
  .scene{display:none;width:100%;height:100%}
  .scene.on{display:flex;gap:38px}
  .scene.center{display:none}
  .scene.center.on{display:flex;align-items:center;justify-content:center;flex-direction:column}
  /* ---------- code ---------- */
  .code{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .codehdr{display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;
           background:#131c2e;border-bottom:1px solid var(--line)}
  .dot{width:11px;height:11px;border-radius:50%;background:#3b4a66}
  .dot:nth-child(1){background:#ff5f57}.dot:nth-child(2){background:#febc2e}.dot:nth-child(3){background:#28c840}
  .fn{margin-left:10px;font-size:19px;color:var(--dim);font-family:Consolas,monospace}
  .lines{padding:18px 8px 20px}
  .cl{display:flex;gap:16px;padding:0 16px;line-height:1.52;font-size:27px;
      font-family:Consolas,"Cascadia Mono","Microsoft YaHei",monospace;white-space:pre}
  .cl .ln{width:44px;text-align:right;color:#4a5876;flex:none;font-size:24px;user-select:none}
  .cl .src{white-space:pre}
  .cl.hl{background:linear-gradient(90deg,rgba(88,166,255,.18),rgba(88,166,255,.02));
         box-shadow:inset 3px 0 0 var(--blue)}
  .kw{color:var(--red)} .cm{color:#66738c;font-style:italic}
  .st{color:#a5d6ff} .nm{color:var(--amber)} .fnc{color:var(--purple)} .op{color:var(--cyan)}
  /* ---------- title / notes ---------- */
  .ttl{font-size:40px;font-weight:700;line-height:1.25;margin-bottom:18px}
  .ttl .accent{color:var(--blue)}
  .notes{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blue);
         border-radius:12px;padding:22px 26px}
  .notes h4{font-size:22px;color:var(--dim);font-weight:600;margin-bottom:14px;letter-spacing:1px}
  .bl{font-size:24px;line-height:1.6;margin-bottom:14px;color:#cdd8e8;padding-left:22px;position:relative}
  .bl:last-child{margin-bottom:0}
  .bl:before{content:"▸";position:absolute;left:0;color:var(--blue)}
  .bl code,.ttl code,.dg code{font-family:Consolas,monospace;background:#1b2438;color:var(--amber);
           padding:1px 7px;border-radius:5px;font-size:.92em}
  /* ---------- terminal ---------- */
  .term{background:#080d17;border:1px solid var(--line);border-radius:12px;padding:18px 22px;flex:1;overflow:hidden}
  .term h4{font-size:20px;color:var(--dim);margin-bottom:12px;letter-spacing:1px}
  .ol{font-family:Consolas,monospace;font-size:20px;line-height:1.5;white-space:pre;color:#b9c6da}
  .ol.k{color:var(--green)} .ol.v{color:var(--cyan)}
  /* ---------- diagrams ---------- */
  .dgwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 34px}
  .bitrow{display:flex;align-items:stretch;gap:0;margin:6px 0 18px}
  .bitbox{flex:1;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;
          font-family:Consolas,monospace;font-size:34px;font-weight:700}
  .bitbox small{font-size:18px;font-weight:400;color:#0b1020;margin-top:6px;font-family:"Microsoft YaHei"}
  .bitbox.hi{background:linear-gradient(180deg,#58a6ff,#2f6fbf);color:#04101f;border-radius:12px 0 0 12px}
  .bitbox.lo{background:linear-gradient(180deg,#7ee787,#3fa356);color:#04101f;border-radius:0 12px 12px 0}
  .formula{font-family:Consolas,monospace;font-size:42px;text-align:center;color:var(--amber);margin:14px 0}
  .sub{font-size:23px;color:var(--dim);text-align:center;line-height:1.7}
  .bad{color:var(--red)} .good{color:var(--green)}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0}
  .cell{background:#131c2e;border:1px solid var(--line);border-radius:10px;padding:14px 18px;
        font-family:Consolas,monospace;font-size:26px;color:var(--txt)}
  .cell span{display:block;font-size:18px;color:var(--dim);font-family:"Microsoft YaHei";margin-top:4px}
  .shiftrow{display:flex;align-items:center;gap:12px;font-family:Consolas,monospace;font-size:27px;margin:12px 0}
  .seg{padding:10px 16px;border-radius:8px;background:#131c2e;border:1px solid var(--line)}
  .seg.hi{color:var(--blue)} .seg.lo{color:var(--green)} .seg.mv{color:var(--amber);background:#2a2413}
  .arrow{color:var(--dim);font-size:24px}
  /* ---------- cover / outro ---------- */
  .big{font-size:74px;font-weight:800;text-align:center;line-height:1.25;letter-spacing:1px}
  .big .accent{color:var(--blue)}
  .bigsub{font-size:30px;color:var(--dim);text-align:center;margin-top:26px;line-height:1.7}
  .chips{margin-top:34px;display:flex;gap:16px;justify-content:center}
  .chip{background:#131c2e;border:1px solid var(--line);border-radius:999px;padding:10px 24px;
        font-size:24px;color:#cdd8e8}
  .outro-list{margin-top:12px;display:flex;flex-direction:column;gap:18px;width:1180px}
  .orow{display:flex;gap:18px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:20px 26px}
  .orow .n{width:44px;height:44px;flex:none;border-radius:10px;background:#1b2740;color:var(--blue);
           font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .orow .t{font-size:26px;line-height:1.55;color:#cdd8e8}
  /* ---------- footer ---------- */
  .ftr{display:flex;align-items:center;gap:20px;height:34px;margin-top:16px}
  .dots{display:flex;gap:7px;flex:1}
  .dots i{width:26px;height:6px;border-radius:3px;background:#233049}
  .dots i.on{background:var(--blue)}
  .idx{font-size:19px;color:var(--dim);font-family:Consolas,monospace}
</style>
</head>
<body>
<div class="stage">
  <div class="hdr">
    <div class="brand">用两个 <b>32 位</b> 整数拼出 <b>64 位</b> —— Lua hi / lo 模拟术</div>
    <div class="chapter" id="chap"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="ftr"><div class="dots" id="dots"></div><div class="idx" id="idx"></div></div>
</div>

<script src="data.js"></script>
<script>
/* ============================ 场景定义 ============================ */
const OUT = window.LUAOUT || [];
const S   = window.SNIPPETS || {};

const SCENES = [
  { id:'cover', kind:'center', chapter:'开场',
    html:`<div class="big anim dg">用两个 <span class="accent">32 位</span> 整数<br>模拟 <span class="accent">64 位</span> 整数</div>
          <div class="bigsub anim dg">Lua 5.1 / 5.2 只有 double，bit32 只有 32 位 —— 那就拆成 hi 与 lo</div>
          <div class="chips">
            <div class="chip anim dg">加减乘除</div><div class="chip anim dg">位运算与移位</div>
            <div class="chip anim dg">二补码负数</div><div class="chip anim dg">330 组随机对照</div>
          </div>` },

  { id:'problem_double', chapter:'为什么需要', title:'<code>double</code> 只有 53 位精度',
    code:{ text:
`print(2^53 + 1 == 2^53)     -->  true
print(string.format("%.0f", 2^53 + 1))
                            -->  9007199254740992
print(2^53 + 1 - 2^53)      -->  0`, hl:[1,4] },
    notes:['尾数只有 53 位，<code>2^53</code> 之后的整数不再连续',
           '用 number 存大整数，低位会被悄悄抹掉',
           '所以 64 位整数必须自己表示'] },

  { id:'problem_bit32', chapter:'为什么需要', title:'<code>bit32</code> 也只认 32 位',
    code:{ text:
`-- bit32 的输入输出都只有 32 位
print(bit32.band(0xFFFFFFFF, 0x0F0F0F0F))   -->  252645135
print(bit32.lshift(1, 32))                  -->  0   -- 越界即归零

-- Lua 5.1 更狠：根本没有 bit32 库
print(bit32)                                -->  nil`, hl:[4,6] },
    notes:['位宽不够：再怎么拼也只有 32 位',
           'Lua 5.1 连 bit32 都没有（可用纯算术补，见源码 <code>bit32_pure.lua</code>）',
           '结论：64 位整数要自己造'] },

  { id:'plan_hilo', chapter:'核心思路', title:'<code>V = hi × 2^32 + lo</code>',
    diagram:'hilo',
    notes:['<code>hi</code>、<code>lo</code> 都归一化到 <code>[0, 2^32)</code>',
           '合起来表示 <code>0 … 2^64-1</code>',
           '按二补码解释：<code>hi</code> 最高位为 1 即负数'] },

  { id:'ctor', chapter:'构造', title:'拆开，再归一化',
    code:{ snip:'ctor', hl:[1,2,3,10,11] },
    notes:['<code>u32</code> 取模归一化，负数自动回绕',
           '<code>new</code> 里两个字段都过一遍 <code>u32</code>',
           '<code>fromNumber</code> 只能吃 <code>&lt; 2^53</code> 的数，更大的走字符串'] },

  { id:'fdiv', chapter:'构造', title:'整除的舍入陷阱',
    code:{ snip:'fdiv', hl:[3,4,5,6] },
    notes:['double 相除可能因舍入跨过整数边界',
           '所以整除后用乘法反向修正一次',
           '<code>+ 0.0</code>：强制保持浮点，避免被 5.3 的整数运算截断'] },

  { id:'add', chapter:'加减法', title:'加法：低 32 位进位',
    code:{ snip:'add', hl:[4,5] },
    notes:['<code>lo + lo ≥ 2^32</code> 就减 <code>2^32</code>、高位 +1',
           '<code>hi</code> 溢出不用管 —— 取模时自然丢掉，正好是 <code>mod 2^64</code>',
           '中间值最大 <code>3×2^32</code>，远小于 <code>2^53</code>，double 精确'] },

  { id:'sub', chapter:'加减法', title:'减法、取负与符号位',
    code:{ snip:'sub', hl:[3,4,6,8] },
    notes:['低位不够减 → 加 <code>2^32</code>、高位减 1',
           '取负 = <code>0 - a</code>，靠借位自然得到二补码',
           '判断正负只看 <code>hi ≥ 2^31</code>'] },

  { id:'cmp', chapter:'比较', title:'先比高位，再比低位',
    code:{ snip:'cmp', hl:[4,5,10,11] },
    notes:['无符号：<code>hi</code> 不同就比 <code>hi</code>，否则比 <code>lo</code>',
           '有符号：把符号位异或翻转，再按无符号比',
           '这是二补码比较的经典技巧'] },

  { id:'bitops', chapter:'位运算', title:'两半各算各的',
    code:{ snip:'bitops', hl:[1,2,4] },
    notes:['<code>band / bor / bxor / bnot</code> 分别在 hi、lo 上做一遍',
           '两半之间完全不进位、不干扰',
           '取第 i 位时按 <code>i≥32</code> 选字段'] },

  { id:'shift', chapter:'位运算', title:'移位：跨两半拼接',
    code:{ snip:'shl', hl:[4,5,6,7] },
    diagram:'shift',
    notes:['高位左移后尾部空出的位，用低位最高的 n 位补',
           '<code>n ≥ 32</code> 时整体搬家，直接换字段'] },

  { id:'mul_idea', chapter:'乘法', title:'为什么 32×32 不能直接乘',
    diagram:'mulidea',
    notes:['<code>32 × 32 = 64 位</code>，double 装不下',
           '再拆一层：每个 32 位拆成两个 16 位半字',
           '<code>16 × 16 = 32 位</code>，double 精确表示'] },

  { id:'mul32', chapter:'乘法', title:'<code>mul32</code>：两个 32 位的完整乘积',
    code:{ snip:'mul32', hl:[2,3,6,7,8,9,12] },
    notes:['拆半字 → 三个部分积 <code>v0 / v1 / v2</code>',
           '按 <code>2^16</code> 逐级进位归一，得到 4 个 16 位 limb',
           '最后拼成 <code>(hi, lo)</code>'] },

  { id:'mul64', chapter:'乘法', title:'回到 64 位：只留三项',
    code:{ snip:'mul', hl:[4,5] },
    notes:['<code>lo·lo</code> 的完整 64 位要保留',
           '两组交叉项只取其低 32 位（高 32 位乘上 <code>2^32</code> 已越界）',
           '越界部分丢弃 = <code>mod 2^64</code>'] },

  { id:'divmod', chapter:'除法', title:'二进制长除法，64 步',
    code:{ snip:'divmod', hl:[4,5,6,7,8,9] },
    notes:['余数左移一位，塞进被除数当前位',
           '够减就减，并在商里把该位置 1',
           '从 bit63 循环到 bit0，商与余数一起得到'] },

  { id:'tostring', chapter:'转字符串', title:'反复除 10，倒序拼',
    code:{ snip:'tostring', hl:[2,3,8,9,10] },
    notes:['用前面写好的 <code>divmod</code> 除以 <code>TEN</code>',
           '余数就是最低位，最后倒序拼接',
           '慢，但逻辑最简单，不容易错'] },

  { id:'run_output', chapter:'运行结果', title:'在浏览器里真跑一遍（fengari）',
    out:'range:== 3.:~v',
    notes:['<code>(2^64-1) + 1 = 0</code>：回绕正确',
           '<code>10^18 / 7</code> 商与余数都对得上',
           '移位、与、取反全部符合预期'] },

  { id:'precision', chapter:'运行结果', title:'int64 与 double 的正面对比',
    out:'pick:int64  =,double =',
    notes:['<code>99999999²</code> = <code>9999999800000001</code>',
           'int64 给出精确值',
           'double 已经把最后一位抹掉了'] },

  { id:'selftest', chapter:'运行结果', title:'330 组随机算例对照 Python',
    out:'pick:自检,结论',
    notes:['用 Python 大整数生成标准答案',
           '覆盖 加减乘除 / 与或异或 / 左右移',
           '330 条全部一致，零失败'] },

  { id:'outro', kind:'center', chapter:'总结',
    html:`<div class="big anim dg" style="font-size:58px">记住这三句话</div>
          <div class="outro-list">
            <div class="orow anim dg"><div class="n">1</div><div class="t">表示：<code>V = hi × 2^32 + lo</code>，两半都归一化到 <code>[0, 2^32)</code></div></div>
            <div class="orow anim dg"><div class="n">2</div><div class="t">运算：加减手管进位借位；乘法拆 16 位半字；除法用 64 步长除法</div></div>
            <div class="orow anim dg"><div class="n">3</div><div class="t">坑：double 整除要修正、中间值必须 &lt; 2^53、全程保持浮点</div></div>
            <div class="orow anim dg"><div class="n">!</div><div class="t">LuaJIT / Lua 5.3+ 有原生 64 位整数，只有在 5.1 / 5.2 才需要这套拆分</div></div>
          </div>` },
];

/* ============================ 代码片段渲染 ============================ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const KW = /\b(local|function|end|if|then|else|elseif|return|for|while|do|in|and|or|not|nil|true|false|repeat|until|break|self)\b/;
function hlLua(src){
  const re = /(--[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(0[xX][0-9A-Fa-f]+|\d+\.?\d*(?:[eE][+-]?\d+)?)|([A-Za-z_][A-Za-z0-9_]*)|([{}()\[\]<>+\-*/%^#=~.,;:])/g;
  let out='', last=0, m;
  while((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    last = m.index + m[0].length;
    const t = m[0];
    if(m[1]) out += '<span class="cm">'+esc(t)+'</span>';
    else if(m[2]) out += '<span class="st">'+esc(t)+'</span>';
    else if(m[3]) out += '<span class="nm">'+esc(t)+'</span>';
    else if(m[4]) out += KW.test(t) ? '<span class="kw">'+t+'</span>'
                    : (src[re.lastIndex] === '(' ? '<span class="fnc">'+t+'</span>' : t);
    else out += '<span class="op">'+esc(t)+'</span>';
  }
  out += esc(src.slice(last));
  return out;
}
function md(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>')}

function codeHtml(c){
  let lines, start=1, showNum=true;
  if(c.snip){ const d = S[c.snip]; lines = d.text.split('\n'); start = d.line; }
  else { lines = c.text.split('\n'); showNum = !c.noline; }
  const hl = c.hl || [];
  return `<div class="code"><div class="codehdr"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="fn">${c.snip ? 'int64.lua' : 'lua'}</span></div><div class="lines">` +
    lines.map((L,i)=>`<div class="cl anim${hl.includes(i+1)?' hl':''}">`+
      (showNum?`<span class="ln">${start+i}</span>`:'')+`<span class="src">${hlLua(L)||' '}</span></div>`).join('') +
    `</div></div>`;
}

/* ============================ 图示 ============================ */
function diagramHtml(kind){
  if(kind==='hilo') return `<div class="dgwrap">
    <div class="bitrow anim dg"><div class="bitbox hi">hi<small>高 32 位</small></div><div class="bitbox lo">lo<small>低 32 位</small></div></div>
    <div class="formula anim dg">V = hi × 2<sup>32</sup> + lo</div>
    <div class="sub anim dg">0 ≤ hi, lo &lt; 2<sup>32</sup> &nbsp;·&nbsp; 总位宽 64 bit</div>
    <div class="sub anim dg" style="margin-top:10px">无符号范围 <span class="good">0 … 2<sup>64</sup>-1</span> &nbsp;·&nbsp; 负数：<span class="bad">hi 最高位 = 1</span></div>
  </div>`;
  if(kind==='shift') return `<div class="dgwrap">
    <div class="shiftrow anim dg"><span class="seg hi">hi: AAAA</span><span class="seg lo">lo: BBBB</span><span class="arrow">shl 8 →</span></div>
    <div class="shiftrow anim dg"><span class="seg hi">hi: AA<span class="mv">BB</span></span><span class="seg lo">lo: BBBB<span class="mv">0000</span></span></div>
    <div class="sub anim dg" style="margin-top:8px">lo 的高 8 位 <span class="good">BB</span> 补进 hi 尾部，lo 尾部补 0</div>
  </div>`;
  if(kind==='mulidea') return `<div class="dgwrap">
    <div class="formula anim dg" style="font-size:32px;color:var(--red)">32 × 32 = 64 位&nbsp; ✗ double 装不下</div>
    <div class="sub anim dg">拆半字：x = x1·2<sup>16</sup> + x0 &nbsp;，&nbsp; y = y1·2<sup>16</sup> + y0</div>
    <div class="grid2">
      <div class="cell anim dg">x1·y1 &lt;&lt; 32<span>16×16 = 32 位 ✓</span></div>
      <div class="cell anim dg">x1·y0 &lt;&lt; 16<span>✓ 精确</span></div>
      <div class="cell anim dg">x0·y1 &lt;&lt; 16<span>✓ 精确</span></div>
      <div class="cell anim dg">x0·y0<span>✓ 精确</span></div>
    </div>
    <div class="sub anim dg good">每个部分积 ≤ 32 位，double 完全精确，再按 2<sup>16</sup> 进位归一</div>
  </div>`;
  return '';
}

/* ============================ 输出面板 ============================ */
function outLines(spec){
  if(!spec) return [];
  const [mode, a, b] = spec.split(':');
  if(mode==='range'){
    let i = OUT.findIndex(l=>l.includes(a));
    let j = OUT.findIndex((l,k)=>k>=i && l.includes(b));
    return OUT.slice(i<0?0:i, j<0?OUT.length:j+1);
  }
  if(mode==='pick') return OUT.filter(l=>l.includes(a)||l.includes(b||'\u0000'));
  return [];
}
function outHtml(spec){
  const ls = outLines(spec).filter(l=>l.trim()!==''); if(!ls.length) return '';
  return `<div class="term"><h4>运行结果 · 真实输出</h4>` +
    ls.map(l=>{ const k = l.trim().startsWith('==')||l.trim()==='';
      return `<div class="ol anim ${k?'k':'v'}">${esc(l)||' '}</div>`}).join('') + `</div>`;
}

/* ============================ 构建 ============================ */
const grid = document.getElementById('grid');
const dots = document.getElementById('dots');
const chap = document.getElementById('chap');
const idxEl = document.getElementById('idx');

SCENES.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'scene' + (s.kind==='center' ? ' center' : '');
  if(s.kind==='center'){ el.innerHTML = s.html; }
  else {
    const hasMain = !!(s.code || s.diagram);
    const L = s.code ? codeHtml(s.code) : (s.diagram ? diagramHtml(s.diagram) : outHtml(s.out));
    let R = '';
    if(s.notes) R += `<div class="notes anim"><h4>要点</h4>` +
      s.notes.map(n=>`<div class="bl anim">${md(n)}</div>`).join('') + `</div>`;
    if(hasMain) R += outHtml(s.out);
    el.innerHTML = `<div class="left">${s.title?`<div class="ttl anim">${md(s.title)}</div>`:''}${L}</div>
                    <div class="right">${R}</div>`;
  }
  grid.appendChild(el);
  // 逐个分配动画延迟
  let c = {cl:0, bl:0, ol:0, dg:0, ttl:0};
  el.querySelectorAll('.anim').forEach(n=>{
    let d = 0;
    if(n.classList.contains('ttl')) d = 0;
    else if(n.classList.contains('cl')) d = 140 + (c.cl++)*40;
    else if(n.classList.contains('dg'))  d = 120 + (c.dg++)*130;
    else if(n.classList.contains('ol'))  d = 300 + (c.ol++)*45;
    else if(n.classList.contains('bl'))  d = 420 + (c.bl++)*130;
    else if(n.classList.contains('notes')) d = 300;
    n.dataset.d = d;
  });
  s._el = el;
  const dt = document.createElement('i'); dots.appendChild(dt);
});

/* ============================ 确定性渲染 ============================ */
let DUR = SCENES.map(()=>5000);
window.__setDurations = a => { DUR = a; };
window.__total = () => DUR.reduce((x,y)=>x+y,0);

function ease(p){return 1-Math.pow(1-p,3)}
window.__render = function(t){
  let acc = 0, i = 0;
  for(i=0;i<SCENES.length;i++){ if(t < acc + DUR[i]) break; acc += DUR[i]; }
  if(i>=SCENES.length){ i = SCENES.length-1; acc -= DUR[i]; }
  const local = Math.max(0, t - acc);
  SCENES.forEach((s,k)=>s._el.classList.toggle('on', k===i));
  chap.textContent = SCENES[i].chapter || '';
  idxEl.textContent = (i+1) + ' / ' + SCENES.length;
  [].forEach.call(dots.children,(n,k)=>n.classList.toggle('on', k<=i));
  const nodes = SCENES[i]._el.querySelectorAll('.anim');
  for(const n of nodes){
    const d = +n.dataset.d;
    const p = Math.min(1, Math.max(0, (local - d)/340));
    const e = ease(p);
    n.style.opacity = e;
    n.style.transform = 'translateY(' + ((1-e)*16).toFixed(2) + 'px)';
  }
};
window.__render(0);
</script>
</body>
